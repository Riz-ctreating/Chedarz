<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f57c00">
<title>Chedarz</title>
<style>
:root{--hd:#f57c00;--bg:#fff8e1;--dot:#ffecb3;--in:#fff;--out:#ffe082;--card:#fffdf7;--fg:#2b1d0e;--mut:#8d6e63;--bd:#ffe0b2;--pri:#fb8c00;--blue:#1e88e5;--warn:#c62828}
@media(prefers-color-scheme:dark){:root{--hd:#e65100;--bg:#1c1407;--dot:#2a1d0a;--in:#2e2414;--out:#8a6100;--card:#140e05;--fg:#fff3e0;--mut:#bca98a;--bd:#3a2c14;--pri:#ffa726;--blue:#64b5f6;--warn:#ff8a80}}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--card);color:var(--fg);font:15px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column}
button{border:0;background:none;color:inherit;font:inherit;cursor:pointer}
input{font:inherit;color:var(--fg);outline:none}
.scr{display:none;flex:1;min-height:0;flex-direction:column}
.box{margin:auto;width:min(92%,380px);display:flex;flex-direction:column;gap:12px;padding:24px;border:1px solid var(--bd);border-radius:16px}
.box h1{font-size:22px;color:var(--pri)}.box p{color:var(--mut);font-size:13px}
.box input,#nc input,#gc input,#pc input{padding:12px 14px;border:1px solid var(--bd);border-radius:10px;background:transparent;font-size:16px}
.go{padding:12px;border-radius:24px;background:var(--pri);color:#fff;font-weight:600}
.go:disabled{opacity:.5}
.warn{color:var(--warn);font-size:13px}
.hd{display:flex;align-items:center;gap:10px;padding:calc(8px + env(safe-area-inset-top,0)) 10px 8px;background:var(--hd);color:#fff}
.hd .ic{font-size:20px;padding:4px 8px}
.av{width:42px;height:42px;flex:none;border-radius:50%;background:#a1887f;color:#fff;display:grid;place-items:center;font-weight:700;text-transform:uppercase}
.hd .ti{flex:1;min-width:0}.hd b{display:block;font-size:17px}.hd small{font-size:12px;opacity:.9}
#lst{flex:1;overflow-y:auto}
.tabs{display:flex;background:var(--card);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom,0)}.tabs button{flex:1;padding:8px 0 6px;font-size:12px;font-weight:600;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:3px}.tabs button i{font-style:normal;font-size:20px;padding:2px 18px;border-radius:14px}.tabs button.on{color:var(--fg)}.tabs button.on i{background:var(--out)}
.gn{font-size:13px;font-weight:600;margin-bottom:1px}
.pc{padding:12px 14px;border-bottom:1px solid var(--bd)}.ph{display:flex;gap:10px;align-items:center;margin-bottom:8px}.ph>div:nth-child(2){flex:1}.ph small{display:block;color:var(--mut);font-size:12px}
.pt{margin:6px 0;white-space:pre-wrap;overflow-wrap:anywhere}.pi,.vv{width:100%;max-height:420px;object-fit:cover;border-radius:12px;background:#000;display:block}
.vb{position:relative}.pl{position:absolute;inset:0;margin:auto;width:56px;height:56px;border-radius:50%;background:rgba(0,0,0,.55);color:#fff;font-size:24px}
.lk{margin-top:8px;padding:6px 14px;border-radius:18px;background:var(--hd);color:#fff;display:inline-flex;align-items:center;gap:6px;font-weight:600}.lk svg{width:24px;height:24px;stroke-linejoin:round}.ck{fill:none;stroke:#fff;stroke-width:1.6}.ho{fill:none;stroke:#fff;stroke-width:1.3}.lk.on .ck{fill:#ffd54f}.lk.on .ho{fill:#f57c00;stroke:none}
#pc textarea{padding:12px 14px;border:1px solid var(--bd);border-radius:10px;background:transparent;font-size:16px;resize:none;font-family:inherit}
.fl{padding:10px 12px;border:1px dashed var(--bd);border-radius:10px;color:var(--mut);cursor:pointer}
.ci{display:block;max-width:100%;max-height:300px;border-radius:8px;margin-bottom:4px}
.cl{margin-top:8px;padding:8px;border-radius:10px;background:var(--bg)}.cr{padding:3px 0;font-size:14px;overflow-wrap:anywhere}.cr b{color:var(--pri)}.cd{margin-left:6px;color:var(--mut);font-size:12px}
.cf{display:flex;gap:6px;margin-top:6px}.cf input{flex:1;padding:8px 12px;border:1px solid var(--bd);border-radius:18px;background:transparent;font-size:15px}.cf button{color:var(--pri);font-weight:600}
.it{display:flex;gap:12px;align-items:center;padding:10px 14px;width:100%;text-align:left;border-bottom:1px solid var(--bd)}
.it .c{flex:1;min-width:0}.it .r{display:flex;justify-content:space-between;gap:8px}
.it b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.it .l{color:var(--mut);font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.it .tm{font-size:12px;color:var(--mut)}.it .tm.u{color:var(--pri)}
.bd{min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:var(--pri);color:#fff;font-size:12px;display:grid;place-items:center;font-weight:700}
.emp{margin:auto;padding:20px;text-align:center;color:var(--mut);white-space:pre-line}
.fab{position:absolute;right:18px;bottom:calc(86px + env(safe-area-inset-bottom,0));width:56px;height:56px;border-radius:16px;background:var(--pri);color:#fff;font-size:26px;box-shadow:0 3px 8px rgba(0,0,0,.3)}
#nc,#gc,#pc,#pr{display:none;position:absolute;inset:0;background:rgba(0,0,0,.5);align-items:center;justify-content:center;z-index:5}
#nc>div,#gc>div,#pc>div,#pr>div{width:min(90%,340px);background:var(--card);border-radius:16px;padding:20px;display:flex;flex-direction:column;gap:10px}
#msgs{flex:1;overflow-y:auto;padding:10px 10px 6px;display:flex;flex-direction:column;gap:3px;background:var(--bg);background-image:radial-gradient(var(--dot) 1.2px,transparent 1.2px);background-size:18px 18px}
.sep{align-self:center;margin:8px 0;padding:4px 12px;border-radius:8px;background:var(--in);color:var(--mut);font-size:12px;box-shadow:0 1px 1px rgba(0,0,0,.1)}
.empty{margin:auto;padding:8px 14px;border-radius:8px;background:var(--in);color:var(--mut);font-size:13px;text-align:center}
.m{max-width:82%;align-self:flex-start;display:flex;flex-direction:column}
.m.me{align-self:flex-end;align-items:flex-end}
.t{padding:6px 9px 4px;border-radius:9px;border-top-left-radius:0;background:var(--in);box-shadow:0 1px 1px rgba(0,0,0,.13);overflow-wrap:anywhere;white-space:pre-wrap;min-width:64px}
.m.me .t{background:var(--out);border-top-left-radius:9px;border-top-right-radius:0}
.q{margin:2px 0 4px;padding:4px 8px;border-left:4px solid var(--pri);border-radius:6px;background:rgba(0,0,0,.07);font-size:13px;color:var(--mut);white-space:normal}
.q b{display:block;color:var(--pri);font-size:12px}
.del{font-style:italic;color:var(--mut)}
.mt{float:right;margin:6px 0 0 10px;font-size:11px;color:var(--mut);display:flex;gap:3px;white-space:nowrap}
.tk.b{color:var(--blue)}
.act{display:flex;gap:6px;margin:3px 0}
.act button{padding:5px 12px;border-radius:14px;background:var(--in);font-size:13px;box-shadow:0 1px 1px rgba(0,0,0,.15)}
#rp{display:none;align-items:center;gap:8px;padding:8px 12px;background:var(--card);border-top:1px solid var(--bd)}
#rp .q{flex:1;margin:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#em{display:none;flex-wrap:wrap;gap:2px;padding:6px 10px;background:var(--card);border-top:1px solid var(--bd)}
#em button{font-size:24px;padding:4px 6px}
#err{color:var(--warn);font-size:12px;padding:3px 14px;background:var(--bg)}
#err:empty{display:none}
.bar{display:flex;align-items:center;gap:6px;padding:6px 8px calc(6px + env(safe-area-inset-bottom,0));background:var(--bg)}
.pill{flex:1;display:flex;align-items:center;background:var(--in);border-radius:24px;padding:0 6px}
.pill input{flex:1;border:0;background:transparent;padding:11px 6px;font-size:16px;min-width:0}
.pill button{font-size:22px;padding:4px 6px}
.snd{width:44px;height:44px;border-radius:50%;background:var(--pri);color:#fff;display:grid;place-items:center}
</style>
</head>
<body>
<div class="scr" id="login" style="display:flex">
 <div class="box">
  <h1>💬 Chedarz</h1>
  <p id="lp">Masuk dengan email atau nomor telepon dan kata sandi.</p>
  <input id="nm" class="rg" placeholder="Nama kamu" maxlength="20" autocomplete="off">
  <input id="ph" class="rg" type="tel" placeholder="Nomor telepon (08xx / 628xx)" maxlength="16" autocomplete="off">
  <input id="em" placeholder="Email atau nomor telepon" maxlength="60" autocomplete="username">
  <input id="pw" type="password" placeholder="Kata sandi (min. 6 karakter)" maxlength="40" autocomplete="current-password">
  <button class="go" id="go" disabled>Menghubungkan…</button>
  <button id="fg" style="color:var(--mut);font-size:13px">Lupa kata sandi?</button>
  <button id="reg" disabled style="color:var(--pri);font-weight:600">Daftar akun baru</button>
  <div class="warn" id="warn"></div>
 </div>
</div>
<div class="scr" id="list" style="position:relative">
 <div class="hd"><div class="av" id="mav"></div><div class="ti"><b>Chedarz</b><small id="mph"></small></div><button class="ic" id="out" title="Keluar">⎋</button></div>
 <div id="lst"></div><div class="tabs"><button id="tp" class="on"><i>💬</i>Chat</button><button id="tg"><i>👥</i>Grup</button><button id="to"><i>📝</i>Post</button><button id="tv"><i>🎬</i>Video</button></div>
 <div id="gc"><div>
  <b>Buat grup baru</b><input id="gn" placeholder="Nama grup" maxlength="30">
  <button class="go" id="gm">Buat grup</button>
  <b style="margin-top:6px">Gabung dengan kode</b><input id="gk" placeholder="Kode grup (6 karakter)" maxlength="8">
  <div class="warn" id="ge"></div>
  <button class="go" id="gj">Gabung</button><button id="gx" style="color:var(--mut)">Tutup</button>
 </div></div>
 <div id="pr"><div style="align-items:center">
  <div class="av" id="pav" style="width:96px;height:96px;font-size:40px"></div>
  <b id="pnm"></b>
  <label class="go" style="text-align:center;cursor:pointer;width:100%">Ganti foto<input id="pfi" type="file" accept="image/*" hidden></label>
  <button id="prm" style="color:var(--warn)">Hapus foto</button>
  <button id="pcx" style="color:var(--mut)">Tutup</button>
 </div></div>
 <div id="pc"><div>
  <b id="pct"></b><textarea id="ptx" rows="3" maxlength="500"></textarea>
  <label class="fl">📎 <span id="pfl"></span><input id="pf" type="file" hidden></label>
  <button class="go" id="pcm" type="button" style="background:transparent;border:1px solid var(--pri);color:var(--pri)"></button>
  <img id="ppv" style="display:none;max-height:140px;border-radius:10px;object-fit:cover">
  <div class="warn" id="pe"></div>
  <button class="go" id="po">Kirim</button><button id="px" style="color:var(--mut)">Batal</button>
 </div></div>
 <button class="fab" id="fab">💬</button>
 <div id="nc"><div>
  <b>Chat baru</b><input id="np" type="tel" placeholder="Nomor telepon teman" maxlength="16">
  <div class="warn" id="ne"></div>
  <button class="go" id="ng">Mulai chat</button><button id="nx" style="color:var(--mut)">Batal</button>
 </div></div>
</div>
<div class="scr" id="chat">
 <div class="hd"><button class="ic" id="bk">←</button><div class="av" id="cav"></div><div class="ti"><b id="ct"></b><small id="st"></small></div><button class="ic" id="lg" style="display:none" title="Keluar dari grup">⎋</button></div>
 <div id="msgs"></div><div id="err"></div>
 <div id="rp"><div class="q" id="rq"></div><button id="rx">✕</button></div>
 <div id="em"></div>
 <div class="bar"><div class="pill"><button id="eb">😊</button><button id="ab">📷</button><input id="af" type="file" accept="image/*" hidden><input id="inp" placeholder="Ketik pesan" maxlength="500" autocomplete="off"></div>
 <button class="snd" id="send"><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M2 21l21-9L2 3v7l15 2-15 2z"/></svg></button></div>
</div>

<div id="cam" style="display:none;position:fixed;inset:0;background:#000;z-index:20;flex-direction:column">
 <video id="cmv" playsinline muted autoplay style="flex:1;min-height:0;width:100%;object-fit:cover"></video>
 <div id="cmt" style="position:absolute;top:calc(14px + env(safe-area-inset-top,0px));left:0;right:0;text-align:center;color:#fff;font-weight:700;text-shadow:0 1px 3px #000"></div>
 <div style="display:flex;justify-content:space-around;align-items:center;padding:16px 0 calc(16px + env(safe-area-inset-bottom,0px));background:#000">
  <button id="cmx" style="color:#fff;font-size:28px">✕</button>
  <button id="cmr" style="width:68px;height:68px;border-radius:50%;border:4px solid #fff;background:#e53935"></button>
  <button id="cms" style="color:#fff;font-size:28px">🔄</button>
 </div>
</div>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import {getDatabase,ref,push,set,get,update,remove,onValue,query,limitToLast,serverTimestamp,increment,onDisconnect} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-database.js";
import {getAuth,createUserWithEmailAndPassword,signInWithEmailAndPassword,onAuthStateChanged,signOut,sendPasswordResetEmail} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
const cfg={apiKey:"AIzaSyBDolZieTBFhLXZLRAFb6KzzBiJkx0aN5k",authDomain:"chedarz.firebaseapp.com",projectId:"chedarz",storageBucket:"chedarz.firebasestorage.app",messagingSenderId:"584278897721",appId:"1:584278897721:web:0c13797ede87816850c9e8"};
const CAND=["https://chedarz-default-rtdb.firebaseio.com","https://chedarz-default-rtdb.asia-southeast1.firebasedatabase.app","https://chedarz-default-rtdb.europe-west1.firebasedatabase.app"];
const $=s=>document.querySelector(s);
const ls=(k,v)=>{try{if(v===undefined)return localStorage.getItem(k);v===null?localStorage.removeItem(k):localStorage.setItem(k,v)}catch(e){return null}};
const el=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!==undefined)e.textContent=x;return e};
const EMO=['😀','😂','🥹','😍','😘','😎','🤔','😭','👍','🙏','🔥','❤️','🎉','😅','🤝','👀'];
const hm=t=>new Date(t).toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'});
const dl=t=>{const d=new Date(t),n=new Date(),y=new Date();y.setDate(n.getDate()-1);return d.toDateString()===n.toDateString()?'Hari ini':d.toDateString()===y.toDateString()?'Kemarin':d.toLocaleDateString('id-ID',{day:'numeric',month:'short',year:'numeric'})};
const norm=s=>{let d=String(s).replace(/\D/g,'');if(d.startsWith('0'))d='62'+d.slice(1);return d.length>=9?d:''};
const show=id=>{['login','list','chat'].forEach(s=>$('#'+s).style.display=s===id?'flex':'none')};

let db,auth,mode='p',tab='p',posts={},vids={},vcache={},fOff={},vplay='',openC={},gitems={},members={},gtyp={},me='',myName='',peer='',peerName='',cid='',msgs=[],items={},seen={},pinfo={},ptyping=false,sel=null,replyTo=null,mySeen=0,tT=null,typing=false,sending=false,offs=[],lOff=null,gOff=null;

(async()=>{
 let url=null;
 for(const u of CAND){try{const r=await fetch(u+'/.json?shallow=true');if(r.ok||r.status===401){url=u;break}}catch(e){}}
 if(!url){$('#go').textContent='Tidak terhubung';$('#warn').textContent='Database tidak ditemukan. Pastikan Realtime Database sudah dibuat, lalu muat ulang.';return}
 db=getDatabase(initializeApp({...cfg,databaseURL:url}));
 if(location.protocol==='file:'){$('#go').textContent='Perlu link https';$('#warn').textContent='Akun tidak bisa dibuat dari file lokal. Taruh file ini di hosting (mis. GitHub Pages), lalu buka lewat linknya.';return}
 auth=getAuth();$('#go').disabled=false;$('#reg').disabled=false;$('#go').textContent='Masuk';
 onAuthStateChanged(auth,async u=>{
  if(!u||me)return;
  let p='',n='';
  try{
   if(regInfo){p=regInfo.p;n=regInfo.n;regInfo=null;await set(ref(db,'uidPhone/'+u.uid),p)}
   else if(u.email.endsWith('@chedarz.app'))p=u.email.split('@')[0];
   else p=(await get(ref(db,'uidPhone/'+u.uid))).val()||'';
   if(!n&&p)n=(await get(ref(db,'users/'+p+'/name'))).val()||'';
  }catch(e){}
  if(!p){$('#warn').textContent='Akun ini belum terhubung ke nomor telepon. Daftar ulang dengan nomor.';signOut(auth);return}
  enter(n||('+'+p),p);
 });
})();

let regInfo=null,regMode=false;
function setMode(r){
 regMode=r;document.querySelectorAll('.rg').forEach(e=>e.style.display=r?'':'none');
 $('#em').placeholder=r?'Email':'Email atau nomor telepon';
 $('#go').textContent=r?'Daftar':'Masuk';$('#reg').textContent=r?'Sudah punya akun? Masuk':'Daftar akun baru';
 $('#fg').style.display=r?'none':'';$('#warn').textContent='';
 $('#lp').textContent=r?'Buat akun dengan nama, nomor telepon, dan email aktif (untuk pemulihan kata sandi).':'Masuk dengan email atau nomor telepon dan kata sandi.';
}
async function doAuth(){
 const w=$('#warn');w.textContent='';
 const pw=$('#pw').value,idv=$('#em').value.trim();
 if(pw.length<6){w.textContent='Kata sandi minimal 6 karakter.';return}
 try{
  if(regMode){
   const n=$('#nm').value.trim(),p=norm($('#ph').value),em=idv.toLowerCase();
   if(n.length<2){w.textContent='Isi nama (min. 2 huruf).';return}
   if(!p){w.textContent='Nomor telepon tidak valid.';return}
   if(!/^\S+@\S+\.\S+$/.test(em)){w.textContent='Isi email yang valid.';return}
   if((await get(ref(db,'users/'+p+'/name'))).exists()){w.textContent='Nomor ini sudah dipakai akun lain.';return}
   regInfo={n,p};
   await createUserWithEmailAndPassword(auth,em,pw);
  }else{
   const em=idv.includes('@')?idv.toLowerCase():(norm(idv)?norm(idv)+'@chedarz.app':'');
   if(!em){w.textContent='Isi email atau nomor telepon yang benar.';return}
   await signInWithEmailAndPassword(auth,em,pw);
  }
 }catch(e){
  regInfo=null;const c=e&&e.code||'';
  w.textContent=c==='auth/email-already-in-use'?'Email sudah terdaftar. Tekan "Sudah punya akun? Masuk".':c==='auth/invalid-email'?'Format email tidak valid.':c==='auth/operation-not-allowed'?'Aktifkan Email/Password di Firebase Authentication.':c==='auth/weak-password'?'Kata sandi terlalu lemah.':(c==='auth/invalid-credential'||c==='auth/user-not-found'||c==='auth/wrong-password')?'Email/nomor atau kata sandi salah.':c==='auth/operation-not-supported-in-this-environment'?'Buka lewat link https (hosting), bukan file lokal.':c==='auth/too-many-requests'?'Terlalu banyak percobaan. Coba lagi nanti.':'Gagal ('+c+').';
 }
}
async function resetPw(){
 const w=$('#warn'),v=$('#em').value.trim();
 if(!v.includes('@')){w.textContent='Isi emailmu di kolom Email, lalu tekan Lupa kata sandi.';return}
 try{await sendPasswordResetEmail(auth,v.toLowerCase());w.textContent='Jika email terdaftar, link reset sudah dikirim. Cek inbox dan folder spam.'}
 catch(e){w.textContent='Gagal mengirim ('+(e&&e.code||'error')+').'}
}
function enter(n,p){
 me=p;myName=n;
 const u=ref(db,'users/'+me);
 update(u,{name:n}).catch(e=>{$('#warn').textContent='Gagal masuk ('+(e&&e.code||'error')+'). Cek aturan database.'});
 const on=ref(db,'users/'+me+'/online');set(on,true);onDisconnect(on).set(false);
 onDisconnect(ref(db,'users/'+me+'/last')).set(serverTimestamp());
 setAv($('#mav'),me,n[0]);$('#mph').textContent=n+' · +'+me;
 show('list');setTab('p');
 lOff=onValue(ref(db,'userChats/'+me),s=>{items=s.val()||{};renderList()});
 gOff=onValue(ref(db,'userGroups/'+me),s=>{gitems=s.val()||{};renderList()});
}
function renderList(){
 if(tab==='o'||tab==='v'){renderFeed();return}
 const box=$('#lst');box.textContent='';
 const a=Object.entries(tab==='p'?items:gitems).sort((x,y)=>(y[1].ts||0)-(x[1].ts||0));
 if(!a.length)box.appendChild(el('div','emp',tab==='p'?'Belum ada chat.\nTekan 💬 untuk mulai chat dengan nomor teman.':'Belum ada grup.\nTekan 👥 untuk membuat grup atau gabung dengan kode.'));
 a.forEach(([p,v])=>{
  const b=el('button','it'),nm=v.name||('+'+p);
  const av=el('div','av');if(tab==='p')setAv(av,p,nm[0]==='+'?'#':nm[0]);else av.textContent=nm[0];b.appendChild(av);
  const c=el('div','c'),r1=el('div','r'),r2=el('div','r');
  r1.appendChild(el('b','',nm));r1.appendChild(el('span','tm'+(v.unread?' u':''),v.ts?hm(v.ts):''));
  r2.appendChild(el('div','l',v.last||''));if(v.unread)r2.appendChild(el('span','bd',v.unread));
  c.appendChild(r1);c.appendChild(r2);b.appendChild(c);b.onclick=()=>tab==='p'?openChat(p,nm):openGroup(p,nm);box.appendChild(b);
 });
}
function openChat(p,nm){
 mode='p';peer=p;peerName=nm;cid=[me,p].sort().join('_');msgs=[];seen={};pinfo={};ptyping=false;mySeen=0;sel=null;

function camRec(){
